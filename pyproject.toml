[project]
name = "trakt-ify"
version = "0.1.0"
description = "Interactive map of a Trakt watch history, built from related-set overlap"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
trakt-ify = "trakt_ify:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
